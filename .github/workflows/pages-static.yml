name: Deploy static Marimo site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - ipk_head.html
      - requirements.txt
      - verify_editor_deployment.py
      - README.md
      - Makefile
      - Dockerfile
      - .github/workflows/pages-static.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py verify_editor_deployment.py
      - run: python -m marimo check app.py
      - run: |
          mkdir -p site
          python -m marimo export html app.py -o site/index.html --no-include-code -f
          python -c 'from pathlib import Path; p=Path("site/index.html"); s=p.read_text(); s=s.replace("<meta name=\"description\" content=\"a marimo app\" />", "<meta name=\"description\" content=\"Interactive Intelligent Physics Kernel notebook: MU, E8, Spin(10), Standard Model, derivation forest, and falsification dashboard.\" />"); p.write_text(s)'
          touch site/.nojekyll
      - run: python verify_editor_deployment.py --share-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
